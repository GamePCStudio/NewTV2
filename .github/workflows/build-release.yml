name: Build & Release (leanback)

# 每次 push 到 main 即构建 release 版并发布 GitHub Release。
# 同一 Release 发布两套：原版 com.fongmi.android.tv（leanback-*.apk）与
# 共存版 com.ctowl2018.android.newtv2（newtv2-leanback-*.apk），可在设备同时安装。
# 版本号规则：<上游版本号>.NewTV2.<YYYYMMDD>.<HHMMSS>
#   例：5.8.7.NewTV2.20261113.173045（UPSTREAM_VERSION 在下方 Compute version 步骤维护）
#   <YYYYMMDD> / <HHMMSS> 均为北京时间（UTC+8），非 UTC。
# versionCode 用「Unix 秒 - 1700000000」保证单调递增且不超 int 上限。
# 应用内更新检查（Github.REPO = ctowl2018/NewTV2）按 语义版本 + 时间戳 判定更新。
# stats/** 是每日统计快照的自动提交，不参与构建，否则每天都会产出一个 Release。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'stats/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & packages
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare local.properties (signing + SDK)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties
          echo "storeFile=$GITHUB_WORKSPACE/keystore/release.jks" >> local.properties
          echo "keyAlias=fongmi" >> local.properties
          echo "keyPassword=fongmi123" >> local.properties
          echo "storePassword=fongmi123" >> local.properties
          cat local.properties

      - name: Compute version (Beijing time, UTC+8)
        id: ver
        env:
          UPSTREAM_VERSION: "5.8.7"
        run: |
          DATE=$(date -d '8 hours' +%Y%m%d)
          TIME=$(date -d '8 hours' +%H%M%S)
          echo "version_name=${UPSTREAM_VERSION}.NewTV2.${DATE}.${TIME}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(( $(date +%s) - 1700000000 ))" >> "$GITHUB_OUTPUT"

      - name: Build leanback release APK (stock + coexist)
        run: |
          chmod +x gradlew
          COMMON_ARGS="--no-configuration-cache --no-daemon --stacktrace"
          # 原版：applicationId 保持 com.fongmi.android.tv，资产名沿用历史 leanback-*.apk。
          ./gradlew :app:assembleLeanbackRelease \
            -PappVersionName="${{ steps.ver.outputs.version_name }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}" \
            $COMMON_ARGS
          # 两次构建输出文件名相同，先挪走原版产物，避免被共存版覆盖。
          mkdir -p release-apks/stock
          cp app/build/outputs/apk/leanback/release/*.apk release-apks/stock/
          # 共存版：仅改设备标识，源码 namespace 不变；资产名加 newtv2- 前缀隔离更新。
          ./gradlew :app:assembleLeanbackRelease \
            -PappApplicationId=com.ctowl2018.android.newtv2 \
            -PappVersionName="${{ steps.ver.outputs.version_name }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}" \
            $COMMON_ARGS
          mkdir -p release-apks/coexist
          cp app/build/outputs/apk/leanback/release/*.apk release-apks/coexist/
          echo "=== stock ==="; ls -l release-apks/stock
          echo "=== coexist ==="; ls -l release-apks/coexist

      - name: Prepare APKs for updater
        run: |
          prepare() {
            dir="$1" prefix="$2"
            cd "$dir"
            shopt -s nullglob
            for target in arm64_v8a armeabi_v7a; do
              cand=$(ls *"${target}"*.apk 2>/dev/null | head -1)
              if [ -n "$cand" ] && [ "$cand" != "${prefix}leanback-${target}.apk" ]; then
                mv -f "$cand" "${prefix}leanback-${target}.apk"
              fi
            done
            ls -l
          }
          prepare "$GITHUB_WORKSPACE/release-apks/stock" ""
          prepare "$GITHUB_WORKSPACE/release-apks/coexist" "newtv2-"

      - name: Prepare Release notes from last commit
        run: |
          body=$(git log -1 --format=%b)
          if [ -z "$body" ]; then body=$(git log -1 --format=%B); fi
          {
            echo "Automated leanback (TV) release built from http://github.com/ctowl2018/NewTV2"
            echo ""
            echo "$body"
          } > release_notes.md
          cat release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: NewTV2 v${{ steps.ver.outputs.version_name }}
          body_path: release_notes.md
          files: |
            release-apks/stock/leanback-arm64_v8a.apk
            release-apks/stock/leanback-armeabi_v7a.apk
            release-apks/coexist/newtv2-leanback-arm64_v8a.apk
            release-apks/coexist/newtv2-leanback-armeabi_v7a.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
